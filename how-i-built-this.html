<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>How I Built This Site | PC Clarity Consulting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #050505;
      --fg: #f5f5f5;
      --muted: #b3b3b3;
      --accent: #3aa9ff;
      --accent-soft: rgba(58, 169, 255, 0.12);
      --border: #262626;
      --card: #111111;
      --max-width: 960px;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #111 0, #050505 45%, #000 100%);
      color: var(--fg);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .nav-brand {
      font-weight: 600;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      font-size: 0.85rem;
    }

    .nav-links a {
      color: var(--muted);
      padding: 0.25rem 0.4rem;
      border-radius: 999px;
    }

    .nav-links a.active {
      color: var(--fg);
      background: var(--accent-soft);
      border: 1px solid rgba(58, 169, 255, 0.4);
    }

    main {
      max-width: var(--max-width);
      margin: 2.5rem auto 3.5rem;
      padding: 0 1.25rem;
    }

    .hero {
      margin-bottom: 2.5rem;
    }

    .hero-kicker {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .hero h1 {
      font-size: clamp(1.9rem, 3vw, 2.4rem);
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    .hero-sub {
      color: var(--muted);
      max-width: 40rem;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr);
      gap: 1.75rem;
      align-items: flex-start;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.25rem 1.3rem;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .card ul {
      list-style: none;
      margin-top: 0.4rem;
    }

    .card li {
      font-size: 0.9rem;
      padding-left: 1.1rem;
      position: relative;
      color: var(--fg);
      margin-bottom: 0.35rem;
    }

    .card li::before {
      content: "•";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .section {
      margin-top: 1.75rem;
    }

    .section h2 {
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
    }

    .section p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .pill {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.01);
    }

    .steps {
      margin-top: 0.6rem;
    }

    .step {
      border-left: 2px solid var(--border);
      padding-left: 0.75rem;
      margin-bottom: 0.7rem;
    }

    .step-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.15rem;
    }

    .step-body {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .callout {
      border-radius: var(--radius);
      border: 1px solid rgba(58, 169, 255, 0.4);
      background: radial-gradient(circle at top left, rgba(58, 169, 255, 0.16), transparent 55%);
      padding: 1rem 1.1rem;
      font-size: 0.9rem;
      margin-top: 1.5rem;
    }

    .callout strong {
      color: var(--fg);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 1.25rem 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      .nav {
        flex-direction: column;
        align-items: flex-start;
      }

      .grid {
        grid-template-columns: minmax(0, 1fr);
      }

      main {
        margin-top: 2rem;
      }
    }
  </style>
</head>
